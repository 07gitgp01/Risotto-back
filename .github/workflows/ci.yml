name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: risotto
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: risotto_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U risotto -d risotto_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: risotto
      DB_PASSWORD: ci-only-password
      DB_NAME: risotto_test
      DB_TEST_NAME: risotto_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: risotto-back:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
